<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<style>
  :root{--bg:#f6f7fb;--panel:#fff;--text:#1a1c2b;--muted:#5b5f78;--accent:#5b3bd6;--border:#e4e6f0}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1020;--panel:#161a30;--text:#eef0f7;--muted:#a7abc4;--accent:#8b5bff;--border:#2a2f4c}}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  main{max-width:44rem;margin:0 auto;padding:40px 20px 72px}
  h1,h2,h3{line-height:1.3}
  h1{font-size:1.6rem;margin:0 0 1.2rem}
  a{color:var(--accent)}
  table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:left}
  code{background:var(--panel);border:1px solid var(--border);padding:.1em .35em;border-radius:4px}
  hr{border:0;border-top:1px solid var(--border);margin:2rem 0}
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
